<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 24px;
            width: 100%;
            max-width: 440px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 20px;
            color: #0460B6;
            text-align: center;
        }

        .info-banner {
            background-color: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #0369a1;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #0f172a;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 18px 14px;
            text-align: center;
            background-color: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
        }

        .drop-icon {
            width: 28px;
            height: 28px;
            stroke: #64748b;
            margin-bottom: 4px;
        }

        .drop-text {
            font-size: 13px;
            color: #334155;
            font-weight: 500;
        }

        .drop-text .highlight {
            color: #7c3aed;
            font-weight: 600;
        }

        .drop-subtext {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        /* File List Container */
        .file-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 210px;
            overflow-y: auto;
        }

        /* Individual File Item Card */
        .file-item {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-name {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            line-height: 1;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background-color: #fee2e2;
            color: #dc2626;
        }

        /* File Controls & Stepper Row */
        .file-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
        }

        /* Stepper Component (Minus, Count, Plus) */
        .stepper-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .stepper-label {
            font-size: 11px;
            font-weight: 500;
            color: #475569;
        }

        .stepper {
            display: inline-flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .stepper-btn {
            background: #f1f5f9;
            border: none;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
            width: 28px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-color 0.15s;
        }

        .stepper-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .stepper-btn:disabled {
            color: #cbd5e1;
            cursor: not-allowed;
            background-color: #f8fafc;
        }

        .stepper-count {
            padding: 0 10px;
            font-weight: 600;
            font-size: 12px;
            color: #0f172a;
            min-width: 24px;
            text-align: center;
        }

        .file-size-info {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
        }

        button.submit-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            margin-top: 8px;
        }

        button.submit-btn:hover {
            background-color: #1d4ed8;
        }

        button.submit-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            margin-top: 14px;
            font-weight: 500;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>BRACU Print Station</h2>

        <div class="info-banner">
            ℹ️ <strong>Print Queue Info:</strong> Jobs expire after <strong>4 hours</strong>. Page ranges can be adjusted directly on the physical printer touchscreen.
        </div>

        <div class="form-group">
            <label>Select Files:</label>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('file').click()">
                <svg class="drop-icon" id="dropIcon" viewBox="0 0 24 24" fill="none" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <div class="drop-text" id="dropText">
                    <span class="highlight">Click to upload</span> or drag and drop
                </div>
                <div class="drop-subtext" id="dropSubtext">PDF, DOCX, PPTX, XLSX (max 25 MB total)</div>
            </div>
            <input type="file" id="file" accept=".pdf,.docx,.pptx,.xlsx" multiple style="display: none;"
                onchange="handleFileSelect(this)">

            <!-- Container for list of chosen files with per-file steppers -->
            <div id="fileList" class="file-list"></div>
        </div>

        <div class="form-group">
            <label for="printMode">Print Options:</label>
            <select id="printMode">
                <option value="single">Single-sided</option>
                <option value="duplex">Double-sided (#duplex)</option>
            </select>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="uploadFiles()">Send to Printer</button>
        <div id="status"></div>
    </div>

    <script>
        var selectedFiles = [];
        var dropZone = document.getElementById('dropZone');
        var fileInput = document.getElementById('file');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        });

        dropZone.addEventListener('drop', e => {
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                addFiles(e.dataTransfer.files);
            }
        });

        function handleFileSelect(input) {
            if (input.files && input.files.length > 0) {
                addFiles(input.files);
            }
        }

        function addFiles(files) {
            for (var i = 0; i < files.length; i++) {
                selectedFiles.push({ file: files[i], copies: 1 });
            }
            fileInput.value = ''; // Reset input to allow re-selecting same files
            renderFileList();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        function changeCopies(index, delta) {
            var currentCopies = selectedFiles[index].copies;
            var newCopies = currentCopies + delta;
            
            if (newCopies < 1) newCopies = 1;
            if (newCopies > 40) newCopies = 40;

            selectedFiles[index].copies = newCopies;
            renderFileList();
        }

        function getGrandTotalBytes() {
            var total = 0;
            for (var i = 0; i < selectedFiles.length; i++) {
                total += selectedFiles[i].file.size * selectedFiles[i].copies;
            }
            return total;
        }

        function renderFileList() {
            var fileListContainer = document.getElementById('fileList');
            fileListContainer.innerHTML = '';
            var grandTotalBytes = getGrandTotalBytes();
            var totalJobs = 0;

            selectedFiles.forEach(function (item, index) {
                var file = item.file;
                var copies = item.copies;
                var singleSizeMB = file.size / (1024 * 1024);
                var totalItemBytes = file.size * copies;
                var totalItemSizeMB = totalItemBytes / (1024 * 1024);

                totalJobs += copies;

                // Main card element
                var card = document.createElement('div');
                card.className = 'file-item';

                // File Header (Name + Remove Button)
                var header = document.createElement('div');
                header.className = 'file-header';

                var nameEl = document.createElement('span');
                nameEl.className = 'file-name';
                nameEl.innerText = file.name;

                var deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.title = 'Remove file';
                deleteBtn.onclick = function (e) {
                    e.stopPropagation();
                    removeFile(index);
                };

                header.appendChild(nameEl);
                header.appendChild(deleteBtn);

                // Controls Row (Stepper + Size Info)
                var controlsRow = document.createElement('div');
                controlsRow.className = 'file-controls-row';

                // Stepper component (Minus, Count, Plus)
                var stepperContainer = document.createElement('div');
                stepperContainer.className = 'stepper-container';

                var label = document.createElement('span');
                label.className = 'stepper-label';
                label.innerText = 'Copies:';

                var stepper = document.createElement('div');
                stepper.className = 'stepper';

                var minusBtn = document.createElement('button');
                minusBtn.type = 'button';
                minusBtn.className = 'stepper-btn';
                minusBtn.innerText = '−';
                minusBtn.disabled = (copies <= 1);
                minusBtn.onclick = function () { changeCopies(index, -1); };

                var countSpan = document.createElement('span');
                countSpan.className = 'stepper-count';
                countSpan.innerText = copies;

                var plusBtn = document.createElement('button');
                plusBtn.type = 'button';
                plusBtn.className = 'stepper-btn';
                plusBtn.innerText = '+';
                
                // Disable plus button if next copy would exceed 25 MB limit or 40 copies
                var nextTotalBytes = grandTotalBytes + file.size;
                plusBtn.disabled = (copies >= 40 || nextTotalBytes > 25 * 1024 * 1024);
                plusBtn.onclick = function () { changeCopies(index, 1); };

                stepper.appendChild(minusBtn);
                stepper.appendChild(countSpan);
                stepper.appendChild(plusBtn);

                stepperContainer.appendChild(label);
                stepperContainer.appendChild(stepper);

                // File Size Info
                var sizeInfo = document.createElement('span');
                sizeInfo.className = 'file-size-info';
                sizeInfo.innerText = copies > 1 
                    ? totalItemSizeMB.toFixed(2) + ' MB (' + copies + ' × ' + singleSizeMB.toFixed(2) + ' MB)' 
                    : singleSizeMB.toFixed(2) + ' MB';

                controlsRow.appendChild(stepperContainer);
                controlsRow.appendChild(sizeInfo);

                card.appendChild(header);
                card.appendChild(controlsRow);
                fileListContainer.appendChild(card);
            });

            updateDropZoneUI(grandTotalBytes / (1024 * 1024), totalJobs);
        }

        function updateDropZoneUI(grandTotalMB, totalJobs) {
            var dropText = document.getElementById('dropText');
            var dropSubtext = document.getElementById('dropSubtext');
            var dropIcon = document.getElementById('dropIcon');

            if (selectedFiles.length > 0) {
                dropZone.style.borderColor = '#16a34a';
                dropZone.style.backgroundColor = '#f0fdf4';
                dropIcon.style.stroke = '#16a34a';

                dropText.innerHTML = '<span style="color: #15803d; font-weight: 600;">✓ ' + selectedFiles.length + ' file(s) added (' + totalJobs + ' total print job' + (totalJobs > 1 ? 's' : '') + ')</span>';
                dropSubtext.innerText = grandTotalMB.toFixed(2) + ' MB total attachment size';
            } else {
                dropZone.style.borderColor = '#cbd5e1';
                dropZone.style.backgroundColor = '#f8fafc';
                dropIcon.style.stroke = '#64748b';

                dropText.innerHTML = '<span class="highlight">Click to upload</span> or drag and drop';
                dropSubtext.innerText = 'PDF, DOCX, PPTX, XLSX (max 25 MB total)';
            }
        }

        function readFileAsBase64(item) {
            return new Promise((resolve, reject) => {
                var reader = new FileReader();
                reader.onload = () => resolve({
                    fileName: item.file.name,
                    mimeType: item.file.type,
                    copies: item.copies,
                    base64: reader.result.split(',')[1]
                });
                reader.onerror = error => reject(error);
                reader.readAsDataURL(item.file);
            });
        }

        async function uploadFiles() {
            var printMode = document.getElementById('printMode').value;
            var statusDiv = document.getElementById('status');
            var btn = document.getElementById('submitBtn');

            if (!selectedFiles.length) {
                statusDiv.className = 'error';
                statusDiv.innerText = 'Please select at least one file.';
                return;
            }

            var totalBytes = getGrandTotalBytes();
            var totalJobs = 0;
            for (var i = 0; i < selectedFiles.length; i++) {
                totalJobs += selectedFiles[i].copies;
            }

            if (totalBytes > 25 * 1024 * 1024) {
                statusDiv.className = 'error';
                statusDiv.innerText = 'Total attachment size across all file copies exceeds 25 MB (' + (totalBytes / (1024 * 1024)).toFixed(2) + ' MB).';
                return;
            }

            btn.disabled = true;
            statusDiv.className = '';
            statusDiv.innerText = 'Sending ' + totalJobs + ' print job(s) across ' + selectedFiles.length + ' file(s)...';

            try {
                var filePromises = selectedFiles.map(readFileAsBase64);
                var fileDataArray = await Promise.all(filePromises);

                var payload = {
                    files: fileDataArray,
                    printMode: printMode
                };

                google.script.run
                    .withSuccessHandler(function (response) {
                        statusDiv.className = 'success';
                        statusDiv.innerText = response;
                        btn.disabled = false;
                        selectedFiles = [];
                        renderFileList();
                    })
                    .withFailureHandler(function (error) {
                        statusDiv.className = 'error';
                        statusDiv.innerText = 'Error: ' + error.message;
                        btn.disabled = false;
                    })
                    .processUpload(payload);

            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.innerText = 'Error reading files: ' + err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
